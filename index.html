<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TokoKu Super App</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#2563eb;--ok:#16a34a;--danger:#dc2626;--warn:#f59e0b}
    body.dark{--bg:#020617;--card:#0f172a;--text:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--brand:#60a5fa;--ok:#4ade80;--danger:#f87171;--warn:#fbbf24}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;padding-bottom:74px}
    .app{max-width:980px;margin:0 auto}.sticky{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:20}
    .header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}.title{font-weight:800;color:var(--brand);font-size:18px}
    .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px}
    .panel,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.panel{padding:12px}.card{padding:8px}
    .card img{width:100%;height:120px;object-fit:cover;border-radius:10px}.meta{font-size:12px;color:var(--muted)}.price{font-weight:800;color:var(--brand)}
    .sec{padding:10px 12px}.hidden{display:none!important}.small{font-size:12px}.muted{color:var(--muted)}
    .toolbar{padding:0 12px 8px;display:grid;gap:8px;grid-template-columns:1fr 1fr}
    input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px}
    button{border:none;border-radius:10px;padding:10px;color:#fff;background:var(--brand);font-weight:700;cursor:pointer}button.outline{background:transparent;color:var(--brand);border:1px solid var(--brand)}button.danger{background:var(--danger)}
    .badge{background:var(--danger);border-radius:999px;padding:1px 6px;font-size:11px;color:#fff}.banner{margin:10px 12px;height:130px;border-radius:14px;overflow:hidden;position:relative}
    .banner img{width:100%;height:100%;object-fit:cover}.dots{position:absolute;right:8px;bottom:8px;display:flex;gap:5px}.dot{width:8px;height:8px;border-radius:50%;background:#ffffff80}.dot.active{background:#fff}
    .view{display:none}.view.active{display:block}.bottom{position:fixed;left:0;right:0;bottom:0;max-width:980px;margin:auto;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}
    .navbtn{text-align:center;padding:9px 4px;color:var(--muted)}.navbtn.active{color:var(--brand);font-weight:800}
    .tabs{display:flex;gap:6px;overflow:auto;margin:8px 0}.tabs button{white-space:nowrap;font-size:12px;padding:8px 10px}
    .kv{display:grid;grid-template-columns:180px 1fr;gap:8px;font-size:12px}.kv div{padding:8px;border-radius:8px;background:color-mix(in srgb,var(--card),var(--line) 30%)}
    .chatbox{height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}.msg{padding:6px 8px;border-radius:8px;max-width:85%;margin:4px 0}
    .me{margin-left:auto;background:#bfdbfe;color:#0f172a}.other{background:color-mix(in srgb,var(--card),var(--line) 55%)}
    .modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:40}.modal.show{display:flex}.sheet{width:100%;max-width:980px;margin:auto;background:var(--card);padding:12px;border-radius:16px 16px 0 0;max-height:88vh;overflow:auto}
  </style>
</head>
<body>
<div class="app">
  <div class="sticky"><div class="header">
    <div class="title" id="appTitle">Marketplace Penjual</div>
    <div class="row" style="flex:0 0 auto">
      <button class="outline small" id="themeBtn">🌙</button>
      <button class="outline small" id="btnNotif">🔔 <span id="notifBadge" class="badge hidden">0</span></button>
      <button class="outline small" id="btnCart">🛒 <span id="cartBadge" class="badge hidden">0</span></button>
    </div>
  </div></div>

  <section id="v-home" class="view active">
    <div class="banner" id="bannerWrap"></div>
    <div class="toolbar">
      <input id="search" placeholder="Cari produk/toko..." />
      <select id="catFilter"><option value="">Semua Kategori</option></select>
      <div class="row"><input id="minP" type="number" placeholder="Harga min"><input id="maxP" type="number" placeholder="Harga max"></div>
      <div class="row"><select id="sortBy"><option value="new">Terbaru</option><option value="cheap">Termurah</option><option value="sold">Terlaris</option></select><select id="storeFilter"><option value="">Semua Toko</option></select></div>
    </div>
    <div id="products" class="grid"></div>
    <div class="sec row"><button class="outline" id="prevPage">Prev</button><div class="small muted" id="pageInfo"></div><button class="outline" id="nextPage">Next</button></div>
  </section>

  <section id="v-chat" class="view"><div class="sec"><h3>Chat Pembeli ↔ Penjual</h3><div class="panel"><select id="chatRoom"></select><div id="chatBox" class="chatbox"></div><div class="row"><input id="chatText" placeholder="Tulis pesan..."><button id="sendChat">Kirim</button></div></div></div></section>

  <section id="v-account" class="view"><div class="sec"><h3>Akun</h3><div id="authBox" class="panel"></div><div id="userBox" class="hidden"><div id="walletBox" class="panel"></div><div class="tabs"><button class="outline" data-tab="orders">Pesanan</button><button class="outline" data-tab="seller">Seller Center</button><button class="outline" data-tab="settings">Pengaturan</button><button class="outline" data-tab="admin">Admin</button></div><div id="tab-orders" class="panel"></div><div id="tab-seller" class="panel hidden"></div><div id="tab-settings" class="panel hidden"></div><div id="tab-admin" class="panel hidden"></div><button class="danger" id="logoutBtn">Logout</button></div></div></section>
</div>

<div class="bottom"><div class="navbtn active" data-view="home">🏠<br>Home</div><div class="navbtn" data-view="chat">💬<br>Chat</div><div class="navbtn" data-view="account">👤<br>Akun</div></div>
<div class="modal" id="modal"><div class="sheet" id="modalBody"></div></div>

<script>
const KEY='TokoKu_',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>Math.random().toString(36).slice(2,9),now=()=>new Date().toISOString();
const read=(k,d)=>JSON.parse(localStorage.getItem(KEY+k)||JSON.stringify(d)),write=(k,v)=>localStorage.setItem(KEY+k,JSON.stringify(v));
let app=read('app',{theme:'light',admin:{wa:'628123456789',rekening:'BCA 1234567',feeSeller:2,banners:[{img:'https://picsum.photos/seed/a/1000/260',link:'#'},{img:'https://picsum.photos/seed/b/1000/260',link:'#'}]},notifs:[]});
let users=read('users',[{username:'admin',password:'admin',pin:'123456',createdAt:now(),isAdmin:true,saldo:0,mutasi:[],profile:{phone:'',address:''},seller:null,inviteCode:'INVADMIN',inviter:null,rewardedInvite:false}]);
let session=read('session',{username:null,pinVerified:false}),products=read('products',[]),orders=read('orders',[]),carts=read('carts',{}),chats=read('chats',{}),topups=read('topups',[]),withdrawals=read('withdrawals',[]),actionLocks=read('locks',{});
const me=()=>users.find(u=>u.username===session.username),money=n=>`Rp ${Math.round(n||0).toLocaleString('id-ID')}`;

function canAction(name,sec=8){const u=session.username||'guest',k=u+'_'+name,last=actionLocks[k]||0;if(Date.now()-last<sec*1000)return false;actionLocks[k]=Date.now();write('locks',actionLocks);return true;}
function pushNotif(text,to='all'){app.notifs.unshift({id:uid(),text,time:now(),read:false,to});write('app',app);renderBadges();}
function renderBadges(){const u=session.username,n=app.notifs.filter(x=>(x.to==='all'||x.to===u)&&!x.read).length,c=(carts[u]||[]).reduce((a,b)=>a+b.qty,0);$('#notifBadge').textContent=n;$('#cartBadge').textContent=c;$('#notifBadge').classList.toggle('hidden',!n);$('#cartBadge').classList.toggle('hidden',!c);}

if(app.theme==='dark')document.body.classList.add('dark');$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');app.theme=document.body.classList.contains('dark')?'dark':'light';write('app',app);$('#themeBtn').textContent=app.theme==='dark'?'☀️':'🌙';};$('#themeBtn').textContent=app.theme==='dark'?'☀️':'🌙';

let bIdx=0;function renderBanner(){const b=app.admin.banners; if(!b.length)return $('#bannerWrap').innerHTML=''; $('#bannerWrap').innerHTML=`<img src='${b[bIdx].img}'><div class='dots'>${b.map((_,i)=>`<div class='dot ${i===bIdx?'active':''}'></div>`).join('')}</div>`;} setInterval(()=>{if(!app.admin.banners.length)return;bIdx=(bIdx+1)%app.admin.banners.length;renderBanner();},3500);

let page=1,perPage=10;function filteredProducts(){const s=$('#search').value.toLowerCase(),cat=$('#catFilter').value,min=+$('#minP').value||0,max=+$('#maxP').value||1e12,store=$('#storeFilter').value,sort=$('#sortBy').value;let ps=products.filter(p=>p.name.toLowerCase().includes(s)||p.store.toLowerCase().includes(s));ps=ps.filter(p=>(!cat||p.category===cat)&&(!store||p.store===store)&&p.price>=min&&p.price<=max);ps.sort((a,b)=>sort==='cheap'?a.price-b.price:sort==='sold'?b.sold-a.sold:b.createdAt-a.createdAt);return ps;}
function renderProducts(){const ps=filteredProducts(),maxPage=Math.max(1,Math.ceil(ps.length/perPage));page=Math.min(page,maxPage);const show=ps.slice((page-1)*perPage,page*perPage);$('#products').innerHTML=show.map(p=>`<div class='card'><img src='${p.image||"https://picsum.photos/seed/default/300/300"}'><div><b>${p.name}</b></div><div class='meta'>${p.store} • ${p.category} • stok ${p.stock}</div><div class='price'>${money(p.price)}</div><div class='row'><input id='qty_${p.id}' type='number' min='1' value='1'><button onclick="addCart('${p.id}')">+ Keranjang</button></div></div>`).join('')||'<div class="panel" style="grid-column:1/-1">Belum ada produk. Seller bisa daftar dan upload produk.</div>';$('#pageInfo').textContent=`Halaman ${page}/${maxPage} (${ps.length} produk)`;}
function addCart(pid){if(!session.username)return alert('Login dulu');const p=products.find(x=>x.id===pid),u=session.username,qty=Math.max(1,+$(`#qty_${pid}`).value||1);carts[u]=carts[u]||[];const old=carts[u].find(x=>x.pid===pid);if(old)old.qty+=qty;else carts[u].push({pid,qty,name:p.name,price:p.price,store:p.store});write('carts',carts);renderBadges();alert('Masuk keranjang');}

$('#btnCart').onclick=()=>{const u=session.username,list=carts[u]||[],sub=list.reduce((a,b)=>a+b.price*b.qty,0);$('#modalBody').innerHTML=`<h3>Keranjang</h3>${list.map((i,idx)=>`<div class='panel small'><b>${i.name}</b> • ${i.store}<br>${money(i.price)} x ${i.qty}<div class='row'><button class='outline' onclick='cartQty(${idx},-1)'>-</button><button class='outline' onclick='cartQty(${idx},1)'>+</button><button class='danger' onclick='cartDel(${idx})'>Hapus</button></div></div>`).join('')||'Kosong'}<div class='panel'>Subtotal: <b>${money(sub)}</b><button id='goPay'>Checkout</button></div>`;openModal();$('#goPay')?.addEventListener('click',openCheckout)};
window.cartQty=(i,d)=>{const u=session.username;if(!carts[u])return;carts[u][i].qty+=d;if(carts[u][i].qty<=0)carts[u].splice(i,1);write('carts',carts);$('#btnCart').click();renderBadges();};window.cartDel=i=>cartQty(i,-999);

function openCheckout(){const u=me();if(!u)return alert('Login dulu');if(!canAction('checkout',12))return alert('Tunggu beberapa detik sebelum checkout lagi.');const items=carts[u.username]||[];if(!items.length)return alert('Keranjang kosong');const sub=items.reduce((a,b)=>a+b.price*b.qty,0);$('#modalBody').innerHTML=`<h3>Checkout</h3><div class='panel'><input id='addr' placeholder='Alamat' value='${u.profile.address||''}'><div class='row'><select id='pay'><option>Saldo</option><option>Transfer</option><option>COD</option></select><input id='phone' placeholder='No HP' value='${u.profile.phone||''}'></div><small>Batas bayar 24 jam untuk Transfer.</small><div id='sum' class='panel small'>Total: <b>${money(sub+12000)}</b></div><button id='payNow'>Bayar</button></div>`;
  $('#payNow').onclick=()=>{if(!canAction('payment',10))return alert('Ada jeda transaksi, coba lagi sebentar.');const method=$('#pay').value,total=sub+12000;if(method==='Saldo'&&u.saldo<total)return alert('Saldo kurang');const od={id:'O'+Date.now(),user:u.username,items,status:method==='COD'?'Menunggu ACC COD':'Menunggu Bayar',resi:'',createdAt:Date.now(),deadline:Date.now()+86400000,total,method,address:$('#addr').value,phone:$('#phone').value};orders.unshift(od);if(method==='Saldo'){u.saldo-=total;u.mutasi.unshift({time:now(),type:'keluar',amount:total,note:'Bayar '+od.id});od.status='Diproses';}carts[u.username]=[];write('orders',orders);write('carts',carts);write('users',users);pushNotif('Pesanan baru '+od.id,'admin');closeModal();renderAll();};
}
setInterval(()=>{let ch=false;orders.forEach(o=>{if(o.status==='Menunggu Bayar'&&Date.now()>o.deadline){o.status='Batal Otomatis';ch=true;}});if(ch){write('orders',orders);renderAll();}},60000);

function walletUI(){const u=me();$('#walletBox').innerHTML=`<h4>Dompet</h4><div>Saldo: <b>${money(u.saldo)}</b></div><div class='row'><input id='depAmount' type='number' placeholder='Topup'><button id='depBtn'>Topup</button></div><div class='row'><input id='wdAmount' type='number' placeholder='Tarik saldo'><button class='outline' id='wdBtn'>Ajukan Tarik</button></div><div class='small'>Mutasi:</div>${u.mutasi.slice(0,8).map(m=>`<div class='small'>${new Date(m.time).toLocaleString()} - ${m.type} ${money(m.amount)} (${m.note})</div>`).join('')||'-'}`;
  $('#depBtn').onclick=()=>{if(!canAction('topup',10))return alert('Tunggu sebentar sebelum topup lagi');topups.unshift({id:'T'+Date.now(),user:u.username,amount:+$('#depAmount').value,status:'pending'});write('topups',topups);pushNotif('Topup baru dari '+u.username,'admin');alert('Topup menunggu ACC');};
  $('#wdBtn').onclick=()=>{if(!canAction('withdraw',15))return alert('Tunggu sebentar sebelum tarik saldo lagi');const amt=+$('#wdAmount').value;if(amt<10000||amt>u.saldo)return alert('Nominal tidak valid');withdrawals.unshift({id:'W'+Date.now(),user:u.username,amount:amt,status:'pending'});write('withdrawals',withdrawals);pushNotif('Permintaan tarik saldo '+u.username,'admin');alert('Permintaan tarik saldo dikirim');};
}

function sellerUI(){const u=me(),myOrders=orders.filter(o=>o.items.some(i=>i.store===u.seller?.storeName));const selesai=myOrders.filter(o=>o.status==='Selesai').reduce((a,b)=>a+b.total,0),net=selesai*(1-app.admin.feeSeller/100);$('#tab-seller').innerHTML=!u.seller?`<h4>Daftar Seller</h4><input id='sn' placeholder='Nama toko'><textarea id='sd' placeholder='Deskripsi'></textarea><button id='regSeller'>Daftar</button>`:`<h4>Toko: ${u.seller.storeName}</h4><div class='row'><div class='panel small'>Omzet kotor ${money(selesai)}</div><div class='panel small'>Omzet bersih ${money(net)} (potongan ${app.admin.feeSeller}%)</div></div><canvas id='salesChart' height='90'></canvas><h5>Upload Produk</h5><input id='pn' placeholder='Nama produk'><div class='row'><input id='pp' type='number' placeholder='Harga'><input id='ps' type='number' placeholder='Stok'></div><div class='row'><input id='pc' placeholder='Kategori'><input id='pi' placeholder='URL gambar'></div><button id='addProd'>Tambah Produk</button><h5>Pesanan toko</h5>${myOrders.map(o=>`<div class='panel small'>${o.id} - ${o.status} - ${money(o.total)}<div class='row'><button onclick="setStatus('${o.id}','Dikemas')">Kemas</button><button onclick="setStatus('${o.id}','Dikirim')">Kirim</button><input id='rs_${o.id}' placeholder='Resi'></div></div>`).join('')||'-'}`;
  if(!u.seller){$('#regSeller').onclick=()=>{u.seller={storeName:$('#sn').value||('Toko '+u.username),desc:$('#sd').value};write('users',users);renderAll();};return;}
  $('#addProd').onclick=()=>{products.unshift({id:'P'+Date.now(),name:$('#pn').value,price:+$('#pp').value,stock:+$('#ps').value,category:$('#pc').value||'Umum',image:$('#pi').value,store:u.seller.storeName,sold:0,createdAt:Date.now()});write('products',products);renderAll();};
  setTimeout(()=>new Chart(document.getElementById('salesChart'),{type:'line',data:{labels:['Sen','Sel','Rab','Kam','Jum','Sab','Min'],datasets:[{label:'Order',data:[1,3,2,5,4,6,7],borderColor:'#2563eb'}]}}),30);
}
function setStatus(id,s){const o=orders.find(x=>x.id===id);if(!o)return;if(s==='Dikirim')o.resi=$('#rs_'+id).value||o.resi;o.status=s;write('orders',orders);pushNotif(`Order ${id} -> ${s}`,o.user);renderAll();}

function ordersUI(){const u=me(),list=orders.filter(o=>o.user===u.username);$('#tab-orders').innerHTML=`<h4>Riwayat Pesanan</h4>${list.map(o=>`<div class='panel small'><b>${o.id}</b> • ${o.status} • ${money(o.total)}<br>Lacak: ${o.resi||'-'} • Sisa: ${Math.max(0,Math.floor((o.deadline-Date.now())/3600000))} jam<div class='row'><button class='outline' onclick="track('${o.id}')">Lacak</button>${o.status==='Dikirim'?`<button onclick="finishOrder('${o.id}')">Pesanan Selesai</button>`:''}</div></div>`).join('')||'-'}`;}
window.track=id=>{const o=orders.find(x=>x.id===id);alert(o?.resi?`Resi ${o.resi} - ${o.status}`:'Belum ada resi')};
window.finishOrder=id=>{const o=orders.find(x=>x.id===id),u=me();if(!o||o.status!=='Dikirim')return;o.status='Selesai';o.items.forEach(it=>{const p=products.find(x=>x.id===it.pid);if(p)p.sold+=(it.qty||1);const sellerUser=users.find(x=>x.seller?.storeName===it.store);if(sellerUser){const bruto=it.price*it.qty,net=bruto*(1-app.admin.feeSeller/100);sellerUser.saldo+=net;sellerUser.mutasi.unshift({time:now(),type:'masuk',amount:net,note:`Penjualan ${o.id} potongan ${app.admin.feeSeller}%`});}});
  const buyer=users.find(x=>x.username===o.user);buyer.totalDone=(buyer.totalDone||0)+1;if(buyer.inviter&&!buyer.rewardedInvite&&buyer.totalDone>=1){const inv=users.find(x=>x.username===buyer.inviter);if(inv){inv.saldo+=5000;inv.mutasi.unshift({time:now(),type:'masuk',amount:5000,note:'Reward undang teman'});buyer.rewardedInvite=true;pushNotif('Anda dapat hadiah referral Rp5.000',inv.username);}}
  write('orders',orders);write('users',users);renderAll();};

function settingsUI(){const u=me();$('#tab-settings').innerHTML=`<h4>Pengaturan Rapi</h4><div class='kv'><div>Username</div><div>${u.username}</div><div>Tanggal daftar</div><div>${new Date(u.createdAt).toLocaleDateString()}</div><div>PIN Login</div><div>${u.pin?'Aktif':'Belum aktif'}</div><div>Kode Undangan</div><div>${u.inviteCode}</div></div><div class='panel'><b>Update Profil</b><div class='row'><input id='newU' placeholder='Username baru'><input id='newP' placeholder='Password baru'></div><div class='row'><input id='newPin' placeholder='PIN 6 digit'><input id='newPhone' placeholder='No HP'></div><textarea id='newAddr' placeholder='Alamat'></textarea><button id='saveSet'>Simpan</button></div><a href='https://wa.me/${app.admin.wa}' target='_blank'><button class='outline'>Kontak Admin</button></a>`;
  $('#saveSet').onclick=()=>{if($('#newU').value&&!users.some(x=>x.username===$('#newU').value)){u.username=$('#newU').value;session.username=u.username;}if($('#newP').value)u.password=$('#newP').value;if(/^\d{6}$/.test($('#newPin').value))u.pin=$('#newPin').value;if($('#newPhone').value)u.profile.phone=$('#newPhone').value;if($('#newAddr').value)u.profile.address=$('#newAddr').value;write('users',users);write('session',session);renderAll();};
}

function adminUI(){const u=me();if(!u?.isAdmin){$('#tab-admin').innerHTML='Hanya admin.';return;}$('#tab-admin').innerHTML=`<h4>Admin</h4><div class='small'>Potongan seller ${app.admin.feeSeller}%</div><h5>ACC Topup</h5>${topups.filter(t=>t.status==='pending').map(t=>`<div class='panel small'>${t.user} ${money(t.amount)}<div class='row'><button onclick="accTop('${t.id}',1)">ACC</button><button class='danger' onclick="accTop('${t.id}',0)">Tolak</button></div></div>`).join('')||'-'}<h5>ACC Tarik Saldo</h5>${withdrawals.filter(t=>t.status==='pending').map(t=>`<div class='panel small'>${t.user} ${money(t.amount)}<div class='row'><button onclick="accWd('${t.id}',1)">ACC</button><button class='danger' onclick="accWd('${t.id}',0)">Tolak</button></div></div>`).join('')||'-'}<h5>ACC COD</h5>${orders.filter(o=>o.status==='Menunggu ACC COD').map(o=>`<div class='panel small'>${o.id} ${o.user}<div class='row'><button onclick="accCOD('${o.id}',1)">ACC</button><button class='danger' onclick="accCOD('${o.id}',0)">Tolak</button></div></div>`).join('')||'-'}`;}
window.accTop=(id,ok)=>{const t=topups.find(x=>x.id===id);if(!t)return;t.status=ok?'acc':'tolak';if(ok){const u=users.find(x=>x.username===t.user);u.saldo+=t.amount;u.mutasi.unshift({time:now(),type:'masuk',amount:t.amount,note:'Topup ACC'});}write('topups',topups);write('users',users);renderAll();};
window.accWd=(id,ok)=>{const w=withdrawals.find(x=>x.id===id);if(!w)return;w.status=ok?'acc':'tolak';const u=users.find(x=>x.username===w.user);if(ok){u.saldo-=w.amount;u.mutasi.unshift({time:now(),type:'keluar',amount:w.amount,note:'Tarik saldo ACC'});}write('withdrawals',withdrawals);write('users',users);renderAll();};
window.accCOD=(id,ok)=>{const o=orders.find(x=>x.id===id);if(!o)return;o.status=ok?'Diproses':'COD Ditolak';write('orders',orders);renderAll();};

function roomKey(a,b,store){return [a,b].sort().join('__')+'__'+store}
function renderChat(){const u=me();if(!u){$('#chatRoom').innerHTML='<option>Login dulu</option>';$('#chatBox').innerHTML='';return;}let rooms=[];if(u.seller){rooms=orders.filter(o=>o.items.some(i=>i.store===u.seller.storeName)).map(o=>({peer:o.user,store:u.seller.storeName,label:`${o.user} • ${o.id}`}));}else{rooms=orders.filter(o=>o.user===u.username).flatMap(o=>[...new Set(o.items.map(i=>i.store))].map(st=>({peer:users.find(x=>x.seller?.storeName===st)?.username||'seller',store:st,label:`${st} • ${o.id}`})));}$('#chatRoom').innerHTML=rooms.map(r=>`<option value='${r.peer}|${r.store}'>${r.label}</option>`).join('')||'<option>-</option>';drawChat();}
function drawChat(){const u=me();if(!u)return;const val=$('#chatRoom').value;if(!val||val==='-')return $('#chatBox').innerHTML='Belum ada room chat';const [peer,store]=val.split('|');const key=roomKey(u.username,peer,store),msgs=chats[key]||[];$('#chatBox').innerHTML=msgs.map(m=>`<div class='msg ${m.from===u.username?'me':'other'}'>${m.text}<br><small>${new Date(m.time).toLocaleTimeString()}</small></div>`).join('');$('#chatBox').scrollTop=99999;}
$('#chatRoom').onchange=drawChat;$('#sendChat').onclick=()=>{const u=me(),val=$('#chatRoom').value,t=$('#chatText').value.trim();if(!u||!t||!val||val==='-')return;const [peer,store]=val.split('|'),key=roomKey(u.username,peer,store);chats[key]=chats[key]||[];chats[key].push({from:u.username,text:t,time:now()});write('chats',chats);$('#chatText').value='';drawChat();};

function authUI(){const u=me();if(u&&session.pinVerified){$('#authBox').classList.add('hidden');$('#userBox').classList.remove('hidden');walletUI();ordersUI();sellerUI();settingsUI();adminUI();renderChat();$('#appTitle').textContent=u.seller?.storeName||'Marketplace Penjual';return;}$('#appTitle').textContent='Marketplace Penjual';$('#authBox').classList.remove('hidden');$('#userBox').classList.add('hidden');$('#authBox').innerHTML=`<h4>Login Aman (Password + PIN)</h4><input id='un' placeholder='Username'><input id='pw' type='password' placeholder='Password'><input id='pin' type='password' placeholder='PIN 6 digit'><div class='row'><button id='lg'>Login</button><button class='outline' id='rg'>Register</button></div><input id='inv' placeholder='Kode undangan (opsional)'><small>Admin default: admin / admin / 123456</small>`;
  $('#lg').onclick=()=>{const x=users.find(a=>a.username===$('#un').value&&a.password===$('#pw').value&&a.pin===$('#pin').value);if(!x)return alert('Login gagal, cek username/password/PIN');session={username:x.username,pinVerified:true};write('session',session);renderAll();};
  $('#rg').onclick=()=>{const un=$('#un').value,pw=$('#pw').value,pin=$('#pin').value;if(!un||!pw||!/^[0-9]{6}$/.test(pin))return alert('Isi valid + PIN 6 digit');if(users.some(x=>x.username===un))return alert('Username dipakai');const invCode='INV'+uid().toUpperCase(),inviter=users.find(x=>x.inviteCode===$('#inv').value)?.username||null;users.push({username:un,password:pw,pin,createdAt:now(),isAdmin:false,saldo:0,mutasi:[],profile:{phone:'',address:''},seller:null,inviteCode:invCode,inviter,rewardedInvite:false});write('users',users);alert('Register berhasil, silakan login');};}

function openModal(){$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
$('.bottom').onclick=e=>{const b=e.target.closest('.navbtn');if(!b)return;$$('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');const v=b.dataset.view;$$('.view').forEach(s=>s.classList.remove('active'));$('#v-'+v).classList.add('active');if(v==='chat')renderChat();if(v==='account')authUI();};
$('#btnNotif').onclick=()=>{const u=session.username,ns=app.notifs.filter(n=>n.to==='all'||n.to===u);$('#modalBody').innerHTML='<h4>Notifikasi</h4>'+(ns.map(n=>`<div class="panel small">${n.text}<br>${new Date(n.time).toLocaleString()}</div>`).join('')||'-');app.notifs=app.notifs.map(n=>(n.to==='all'||n.to===u)?({...n,read:true}):n);write('app',app);renderBadges();openModal();};

;['#search','#catFilter','#minP','#maxP','#sortBy','#storeFilter'].forEach(id=>$(id).addEventListener('input',()=>{page=1;renderProducts()}));
$('#prevPage').onclick=()=>{page=Math.max(1,page-1);renderProducts()};$('#nextPage').onclick=()=>{page++;renderProducts()};
$$('[data-tab]').forEach(b=>b.onclick=()=>{['orders','seller','settings','admin'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==b.dataset.tab));});
$('#logoutBtn').onclick=()=>{session={username:null,pinVerified:false};write('session',session);renderAll();};

function renderFilters(){const cats=[...new Set(products.map(p=>p.category))],stores=[...new Set(products.map(p=>p.store))];$('#catFilter').innerHTML='<option value="">Semua Kategori</option>'+cats.map(c=>`<option>${c}</option>`).join('');$('#storeFilter').innerHTML='<option value="">Semua Toko</option>'+stores.map(s=>`<option>${s}</option>`).join('')}
function renderAll(){app=read('app',app);users=read('users',users);products=read('products',products);orders=read('orders',orders);carts=read('carts',carts);chats=read('chats',chats);topups=read('topups',topups);withdrawals=read('withdrawals',withdrawals);renderBanner();renderFilters();renderProducts();authUI();renderBadges();}
renderAll();
</script>
</body>
</html>
