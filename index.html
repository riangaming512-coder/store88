<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store88 Pro Commerce</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--brand:#2563eb;--ok:#16a34a;--warn:#f59e0b;--danger:#dc2626}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:76px}
    .app{max-width:980px;margin:0 auto}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:20}
    .row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.sec{padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
    .card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.card img,.media{width:100%;height:140px;object-fit:cover;border-radius:10px;background:#e5e7eb}
    input,select,textarea,button{font:inherit} input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
    button{border:none;background:var(--brand);color:#fff;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.outline{background:#fff;color:var(--brand);border:1px solid var(--brand)}
    .danger{background:var(--danger)} .muted{color:var(--muted)} .small{font-size:12px} .price{font-weight:800;color:var(--brand)} .hidden{display:none!important}
    .nav{position:fixed;left:0;right:0;bottom:0;max-width:980px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
    .nb{padding:8px 4px;text-align:center;font-size:12px;color:#334155}.nb.active{color:var(--brand);font-weight:800}.view{display:none}.view.active{display:block}
    .chip{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.s1{background:#dbeafe;color:#1d4ed8}.s2{background:#fef3c7;color:#92400e}.s3{background:#dcfce7;color:#166534}.s4{background:#fee2e2;color:#991b1b}
    .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 14px;border-radius:999px;z-index:60;display:none}
    .list{display:flex;flex-direction:column;gap:8px}
  </style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="app">
  <header class="top sec row" style="justify-content:space-between">
    <div style="font-size:20px;font-weight:900;color:var(--brand)">Store88 Pro</div>
    <div class="row" style="max-width:330px">
      <input id="search" placeholder="Cari produk / toko..." />
      <button class="outline" id="btnLoginHint">Login</button>
    </div>
  </header>

  <section id="v-home" class="view active sec">
    <div class="panel small muted">Tidak ada item demo. Produk hanya bisa dibuat oleh Admin atau Seller terverifikasi.</div>
    <div id="homeGrid" class="grid" style="margin-top:10px"></div>
  </section>

  <section id="v-topup" class="view sec">
    <div class="panel small">Halaman voucher topup game (khusus produk admin). Pembeli bisa checkout normal, status pesanan diproses otomatis bertahap.</div>
    <div id="topupGrid" class="grid" style="margin-top:10px"></div>
  </section>

  <section id="v-feed" class="view sec">
    <div id="feedComposer" class="panel hidden"></div>
    <div id="feedList" class="list" style="margin-top:10px"></div>
  </section>

  <section id="v-cart" class="view sec">
    <h3>Keranjang & Checkout Pro</h3>
    <div id="cartList" class="list"></div>
    <div id="checkoutBox" class="panel" style="margin-top:10px"></div>
  </section>

  <section id="v-account" class="view sec">
    <div id="auth" class="panel"></div>
    <div id="accountArea" class="hidden">
      <div id="profile" class="panel"></div>
      <div id="sellerBox" class="panel" style="margin-top:10px"></div>
      <div id="adminBox" class="panel" style="margin-top:10px"></div>
      <div id="orderBox" class="panel" style="margin-top:10px"></div>
      <button id="logout" class="danger" style="margin-top:8px">Logout</button>
    </div>
  </section>
</div>

<nav class="nav">
  <div class="nb active" data-v="home">🏠<br>Home</div>
  <div class="nb" data-v="topup">🎮<br>Topup</div>
  <div class="nb" data-v="feed">📸<br>Post</div>
  <div class="nb" data-v="cart">🛒<br>Checkout</div>
  <div class="nb" data-v="account">👤<br>Akun</div>
</nav>

<script>
const KEY='STORE88_PRO_';
const $=s=>document.querySelector(s); const $$=s=>Array.from(document.querySelectorAll(s));
const read=(k,d)=>JSON.parse(localStorage.getItem(KEY+k)||JSON.stringify(d));
const write=(k,v)=>localStorage.setItem(KEY+k,JSON.stringify(v));
const now=()=>new Date().toISOString();
const money=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const uid=()=>Math.random().toString(36).slice(2,10);

let users=read('users',[{username:'admin',password:'admin',isAdmin:true,seller:false,createdAt:now()}]);
let session=read('session',{username:null});
let products=read('products',[]); // no demo items
let carts=read('carts',{});
let orders=read('orders',[]);
let topupProducts=read('topupProducts',[]); // only admin can create
let feed=read('feed',[]);

const me=()=>users.find(u=>u.username===session.username);
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}
function loginGuard(msg='Harap login dulu untuk lanjut.'){ if(!me()){toast(msg);return false;} return true; }

function renderHome(){
  const q=$('#search').value.toLowerCase();
  const list=products.filter(p=>`${p.name} ${p.store}`.toLowerCase().includes(q));
  $('#homeGrid').innerHTML=list.map(p=>`<div class='card'><img src='${p.image||''}' alt='${p.name}'><b>${p.name}</b><div class='small muted'>${p.store}</div><div class='small'>Stok: ${p.stock}</div><div class='price'>${money(p.price)}</div><button onclick="addCart('${p.id}','produk')">+ Keranjang</button></div>`).join('') || "<div class='panel small muted'>Belum ada produk. Admin/Seller bisa menambah dari Akun.</div>";
}

function renderTopup(){
  $('#topupGrid').innerHTML=topupProducts.map(p=>`<div class='card'><img src='${p.image||''}' alt='${p.name}'><b>${p.name}</b><div class='small muted'>Voucher • Admin Store</div><div class='small'>Stok: ${p.stock}</div><div class='price'>${money(p.price)}</div><button onclick="addCart('${p.id}','topup')">Beli Voucher</button></div>`).join('') || "<div class='panel small muted'>Belum ada voucher topup tersedia.</div>";
}

function addCart(id,type){
  if(!loginGuard()) return;
  const u=me().username; carts[u]=carts[u]||[];
  const src=(type==='topup'?topupProducts:products).find(x=>x.id===id); if(!src) return;
  const found=carts[u].find(i=>i.id===id && i.type===type);
  if(found){ if(found.qty>=src.stock) return toast('Stok tidak cukup.'); found.qty++; }
  else carts[u].push({id,type,name:src.name,price:src.price,qty:1,store:src.store||'Admin Store'});
  write('carts',carts); renderCart(); toast('Item masuk keranjang.');
}

function renderCart(){
  const u=me()?.username||'_'; const list=carts[u]||[];
  $('#cartList').innerHTML=list.map((i,idx)=>`<div class='panel small'><b>${i.name}</b> • ${i.type}<br>${money(i.price)} x ${i.qty}<div class='row'><button class='outline' onclick='qty(${idx},-1)'>-</button><button class='outline' onclick='qty(${idx},1)'>+</button><button class='danger' onclick='delItem(${idx})'>Hapus</button></div></div>`).join('') || "<div class='panel small muted'>Keranjang kosong.</div>";
  const sub=list.reduce((a,b)=>a+b.price*b.qty,0), fee=Math.round(sub*0.01), total=sub+fee;
  $('#checkoutBox').innerHTML=`
    <h4>Checkout</h4>
    <div class='small muted'>Biaya layanan 1% untuk proteksi transaksi.</div>
    <div class='row'><input id='addr' placeholder='Alamat / ID tujuan topup'><select id='pay'><option>Transfer Bank</option><option>QRIS</option><option>E-Wallet</option></select></div>
    <div class='small'>Subtotal: <b>${money(sub)}</b><br>Biaya layanan: <b>${money(fee)}</b><br>Total: <b>${money(total)}</b></div>
    <button id='doCheckout'>Bayar & Buat Pesanan</button>
    <div class='small muted'>Setelah checkout: menunggu pembayaran → verifikasi admin → diproses → dikirim/selesai.</div>`;
  $('#doCheckout').onclick=()=>checkout(list,sub,fee,total);
}
function qty(i,d){const u=me()?.username;if(!u)return;const arr=carts[u];if(!arr||!arr[i])return;arr[i].qty+=d;if(arr[i].qty<=0)arr.splice(i,1);write('carts',carts);renderCart();}
function delItem(i){const u=me()?.username;if(!u)return;carts[u].splice(i,1);write('carts',carts);renderCart();}

function checkout(items,sub,fee,total){
  if(!loginGuard()) return;
  if(!items.length) return toast('Keranjang masih kosong.');
  if(!$('#addr').value.trim()) return toast('Isi alamat / ID tujuan terlebih dahulu.');
  const o={id:'ORD-'+Date.now(),user:me().username,items:JSON.parse(JSON.stringify(items)),sub,fee,total,payment:$('#pay').value,address:$('#addr').value,status:'Menunggu Pembayaran',createdAt:Date.now(),updatedAt:Date.now(),timeline:[{status:'Menunggu Pembayaran',time:now(),note:'Harap selesaikan pembayaran dulu.'}]};
  orders.unshift(o); write('orders',orders); carts[me().username]=[]; write('carts',carts); consumeStock(o.items);
  toast('Checkout berhasil. Harap tunggu konfirmasi pembayaran.');
  scheduleOrderFlow(o.id);
  renderAll();
}

function consumeStock(items){
  items.forEach(it=>{
    const list=it.type==='topup'?topupProducts:products; const p=list.find(x=>x.id===it.id);
    if(p) p.stock=Math.max(0,p.stock-it.qty);
  });
  write('products',products); write('topupProducts',topupProducts);
}

function scheduleOrderFlow(orderId){
  setTimeout(()=>updateOrder(orderId,'Menunggu Verifikasi Admin','Pembayaran terdeteksi, admin sedang memverifikasi.'),4000);
  setTimeout(()=>updateOrder(orderId,'Diproses Penjual','Pesanan sedang diproses. Mohon tunggu sebentar.'),9000);
  setTimeout(()=>updateOrder(orderId,'Dikirim / Topup Berhasil','Pesanan telah dikirim atau topup sukses.'),15000);
  setTimeout(()=>updateOrder(orderId,'Selesai','Transaksi selesai. Terima kasih sudah berbelanja.'),21000);
}

function updateOrder(id,status,note){
  const o=orders.find(x=>x.id===id); if(!o) return;
  o.status=status; o.updatedAt=Date.now(); o.timeline.push({status,time:now(),note});
  write('orders',orders); if($('#v-account').classList.contains('active')) renderOrders();
}
function statusChip(s){
  if(s==='Selesai')return `<span class='chip s3'>${s}</span>`;
  if(s.includes('Menunggu'))return `<span class='chip s2'>${s}</span>`;
  if(s.includes('Diproses')||s.includes('Dikirim'))return `<span class='chip s1'>${s}</span>`;
  return `<span class='chip s4'>${s}</span>`;
}

function renderAuth(){
  const u=me();
  if(!u){
    $('#auth').innerHTML=`<h3>Login / Register</h3><div class='row'><input id='u' placeholder='Username'><input id='p' type='password' placeholder='Password'></div><div class='row'><button id='lg'>Login</button><button class='outline' id='rg'>Register</button></div><div class='small muted'>Pesan sistem profesional: Harap login dulu untuk melakukan pembelian, chat, posting, dan checkout.</div>`;
    $('#accountArea').classList.add('hidden');
    $('#lg').onclick=()=>{const user=users.find(x=>x.username===$('#u').value&&x.password===$('#p').value);if(!user)return toast('Login gagal. Cek username/password.');session.username=user.username;write('session',session);renderAll();};
    $('#rg').onclick=()=>{if(!$('#u').value||!$('#p').value)return toast('Username dan password wajib diisi.');if(users.some(x=>x.username===$('#u').value))return toast('Username sudah dipakai.');users.push({username:$('#u').value,password:$('#p').value,isAdmin:false,seller:false,createdAt:now()});write('users',users);toast('Register berhasil. Silakan login.');};
    return;
  }
  $('#auth').innerHTML='<h3>Anda sudah login.</h3>';
  $('#accountArea').classList.remove('hidden');
  $('#profile').innerHTML=`<h4>Profil</h4><div class='small'>User: <b>${u.username}</b> • Role: ${u.isAdmin?'Admin':(u.seller?'Seller':'Pembeli')}</div>`;
  renderSellerBox(u); renderAdminBox(u); renderOrders();
}

function renderSellerBox(u){
  if(u.isAdmin){ $('#sellerBox').innerHTML='<h4>Seller Center</h4><div class="small muted">Admin tidak perlu daftar seller.</div>'; return; }
  $('#sellerBox').innerHTML=!u.seller
    ? `<h4>Seller Center</h4><div class='small muted'>Daftar seller untuk mulai upload produk toko.</div><button id='beSeller'>Daftar Seller</button>`
    : `<h4>Seller Center</h4><div class='small'>Status: Seller aktif</div><div class='row'><input id='pn' placeholder='Nama produk'><input id='pp' type='number' placeholder='Harga'></div><div class='row'><input id='ps' type='number' placeholder='Stok'><input id='pi' placeholder='URL gambar'></div><button id='addP'>Tambah Produk</button>`;
  if(!u.seller){ $('#beSeller').onclick=()=>{u.seller=true;write('users',users);renderAll();toast('Seller aktif.');}; return; }
  $('#addP').onclick=()=>{
    if(!$('#pn').value||!$('#pp').value||!$('#ps').value) return toast('Lengkapi data produk dulu.');
    products.unshift({id:'P-'+uid(),name:$('#pn').value,price:+$('#pp').value,stock:+$('#ps').value,image:$('#pi').value,store:u.username});
    write('products',products); renderHome(); toast('Produk berhasil ditambahkan.');
  }
}

function renderAdminBox(u){
  if(!u.isAdmin){ $('#adminBox').innerHTML='<h4>Admin Center</h4><div class="small muted">Hanya admin yang bisa jual voucher topup game.</div>'; return; }
  $('#adminBox').innerHTML=`<h4>Admin Center</h4><div class='small muted'>Kelola voucher topup game + katalog admin.</div>
  <div class='row'><input id='tn' placeholder='Nama voucher'><input id='tp' type='number' placeholder='Harga'></div>
  <div class='row'><input id='ts' type='number' placeholder='Stok'><input id='ti' placeholder='URL banner voucher'></div>
  <button id='addTopup'>Tambah Voucher Topup</button>
  <hr><div class='small'>Voucher aktif: ${topupProducts.length}</div>`;
  $('#addTopup').onclick=()=>{
    if(!$('#tn').value||!$('#tp').value||!$('#ts').value) return toast('Lengkapi data voucher terlebih dahulu.');
    topupProducts.unshift({id:'T-'+uid(),name:$('#tn').value,price:+$('#tp').value,stock:+$('#ts').value,image:$('#ti').value,store:'Admin Store'});
    write('topupProducts',topupProducts); renderTopup(); toast('Voucher topup berhasil ditambahkan.');
  }
}

function renderOrders(){
  if(!me()) return;
  const mine=orders.filter(o=>o.user===me().username);
  $('#orderBox').innerHTML='<h4>Pesanan Saya</h4>' + (mine.map(o=>`<div class='panel small'>${statusChip(o.status)} <b>${o.id}</b><br>Total: <b>${money(o.total)}</b><br><span class='muted'>${new Date(o.createdAt).toLocaleString()}</span><details><summary>Timeline</summary>${o.timeline.map(t=>`<div>• ${new Date(t.time).toLocaleTimeString()} - ${t.status}<br><span class='muted'>${t.note}</span></div>`).join('')}</details></div>`).join('') || '<div class="small muted">Belum ada pesanan.</div>');
}

function renderFeed(){
  const u=me();
  $('#feedComposer').classList.toggle('hidden',!u);
  $('#feedComposer').innerHTML=u?`<h4>Posting Gambar / Video</h4><textarea id='cap' placeholder='Tulis caption...'></textarea><input id='media' placeholder='URL gambar/video (mp4/webm)'><button id='postBtn'>Posting</button><div class='small muted'>Konten hanya untuk promosi legal. Dilarang spam.</div>`:'';
  if(u) $('#postBtn').onclick=()=>{if(!$('#media').value.trim())return toast('URL media wajib diisi.');feed.unshift({id:uid(),user:u.username,caption:$('#cap').value,url:$('#media').value,time:now()});write('feed',feed);renderFeed();toast('Postingan berhasil dipublish.');};
  $('#feedList').innerHTML=feed.map(f=>{const isVideo=/\.(mp4|webm|ogg)$/i.test(f.url);return `<div class='card'><div class='small muted'>@${f.user} • ${new Date(f.time).toLocaleString()}</div><div style='margin:6px 0'><b>${f.caption||'-'}</b></div>${isVideo?`<video class='media' controls src='${f.url}'></video>`:`<img class='media' src='${f.url}' alt='post'>`}</div>`}).join('')||"<div class='panel small muted'>Belum ada postingan.</div>";
}

function renderAll(){
  users=read('users',users);session=read('session',session);products=read('products',products);carts=read('carts',carts);orders=read('orders',orders);topupProducts=read('topupProducts',topupProducts);feed=read('feed',feed);
  renderHome(); renderTopup(); renderCart(); renderAuth(); renderFeed();
  $('#btnLoginHint').textContent=me()?`Hi, ${me().username}`:'Login';
}

$('#search').oninput=renderHome;
$('#btnLoginHint').onclick=()=>{if(!me()){toast('Harap login dulu melalui tab Akun.');} else {$('.nb[data-v="account"]').click();}}
$('.nav').onclick=e=>{const b=e.target.closest('.nb');if(!b)return;$$('.nb').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.view').forEach(v=>v.classList.remove('active'));$('#v-'+b.dataset.v).classList.add('active');if(b.dataset.v==='cart')renderCart();if(b.dataset.v==='account')renderAuth();if(b.dataset.v==='feed')renderFeed();if(b.dataset.v==='topup')renderTopup();}
$('#logout').onclick=()=>{session.username=null;write('session',session);toast('Anda telah logout.');renderAll();}

renderAll();
</script>
</body>
</html>
